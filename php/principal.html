<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../css/principal.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birdiepedia</title>
</head>
<body>
    <div class="cima">
        <h1 class="h1-cima">Birdiepedia</h1>
        <input type="text" class="barra-cima" placeholder="Pesquise seus pássaros">
        <button class="lupa">O</button>
    </div>
    <div class="passaros">
        <div class="bemtevi">
            <img src="../imgs/bemtevi.jpg" alt="bemtevi" class="card-img">
            <h2 class="card-title">Bem-Te-Vi</h2>
            <p class="card-desc">passaro que é legal e é o goat</p>
        </div>
        <div class="urutau">
            <img src="../imgs/urutau.jpg" alt="urutau" class="card-img">
            <h2 class="card-title">Urutau</h2>
            <p class="card-desc">passaro que é legal e é coruja</p>
        </div>
        <div class="sangue">
            <img src="../imgs/sangue-d-boi.jpg" alt="sangue-d-boi" class="card-img">
            <h2 class="card-title">Sangue-d-Boi</h2>
            <p class="card-desc">passaro  que é sangue e é de boi</p>
        </div>
    </div>
</body>
</html>
